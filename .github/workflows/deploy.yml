name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 94.16.116.251
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/cosmetic-mono/repo
            git pull origin main
            cd /opt/cosmetic-mono
            docker compose up -d --build
